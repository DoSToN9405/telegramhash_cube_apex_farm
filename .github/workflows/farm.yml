name: Cube Farm 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: cube-farm-group
  cancel-in-progress: true

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 310

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка requests
        run: pip install requests

      - name: Запуск фермы
        run: python3 telegramhash_cube_farm.py 0
